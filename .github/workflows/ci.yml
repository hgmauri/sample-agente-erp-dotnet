name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-e-cenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build (com NuGet Audit)
        run: dotnet build sample-agente-erp-dotnet.slnx -c Release

      - name: Pacotes vulneráveis (inclui transitivos)
        run: dotnet list sample-agente-erp-dotnet.slnx package --vulnerable --include-transitive

      # Sobe ERP simulado, API de dados e assistente (com o modelo simulado) e roda os cenários
      - name: Cenários de segurança
        run: |
          dotnet run --project src/Erp.Simulado -c Release --no-build --urls http://localhost:5401 &
          dotnet run --project src/Dados.Api -c Release --no-build --urls http://localhost:5400 &
          dotnet run --project src/Assistente.Api -c Release --no-build --urls http://localhost:5402 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:5400/saude > /dev/null && curl -sf http://localhost:5402/saude > /dev/null && break
            sleep 1
          done
          dotnet run --project src/Cenarios -c Release --no-build
